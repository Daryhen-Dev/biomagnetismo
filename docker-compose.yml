name: centrodoctorgoiz-local

# Local reconstruction of centrodoctorgoiz.cl from the Hostinger hPanel backup.
# Source of truth: u428001751.20261113102107.tar.gz (pristine, never modified).
# The mounted webroot is a disposable extraction of that tarball.

services:
  db:
    image: mariadb:11.8
    container_name: cdg-db
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --max-allowed-packet=256M
    environment:
      MARIADB_ROOT_PASSWORD: cdg-root-local
      MARIADB_DATABASE: centrodoctorgoiz
      MARIADB_USER: wp
      MARIADB_PASSWORD: wp-local
    volumes:
      - db-data:/var/lib/mysql
      - ./source:/backup:ro
    ports:
      - "3307:3306"
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20

  wordpress:
    image: wordpress:php8.3-apache
    container_name: cdg-wp
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: centrodoctorgoiz
      WORDPRESS_DB_USER: wp
      WORDPRESS_DB_PASSWORD: wp-local
      WORDPRESS_DEBUG: "1"
    volumes:
      - ./source/domains/centrodoctorgoiz.cl/public_html:/var/www/html
      - ./docker/php-local.ini:/usr/local/etc/php/conf.d/zz-local.ini:ro
    ports:
      - "8080:80"

  cli:
    image: wordpress:cli-php8.3
    container_name: cdg-cli
    depends_on:
      db:
        condition: service_healthy
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: centrodoctorgoiz
      WORDPRESS_DB_USER: wp
      WORDPRESS_DB_PASSWORD: wp-local
    volumes:
      - ./source/domains/centrodoctorgoiz.cl/public_html:/var/www/html
      - ./docker/php-local.ini:/usr/local/etc/php/conf.d/zz-local.ini:ro
      - ./scripts:/scripts:ro
    entrypoint: ["wp"]
    user: "33:33"

volumes:
  db-data:
