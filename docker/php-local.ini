; Local reconstruction of centrodoctorgoiz.cl — PHP limits for an Elementor site
memory_limit = 512M
upload_max_filesize = 128M
post_max_size = 128M
max_execution_time = 300
max_input_time = 300
max_input_vars = 5000

; The archived site was served over HTTPS with its own domain; keep error noise
; out of the page but logged to the container for diagnosis.
display_errors = Off
log_errors = On
error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT
